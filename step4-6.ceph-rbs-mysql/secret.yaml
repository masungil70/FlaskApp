# Ceph 클러스터 인증을 위한 Secret
apiVersion: v1
kind: Secret
metadata:
  name: ceph-secret
  namespace: ceph-storage
type: Opaque
data:
  # Ceph 사용자 ID (base64 인코딩됨)
  # echo -n "k8s" | base64 -> azhz
  userID: azhz
  # Ceph 사용자 키 (base64 인코딩됨)
  # echo -n "k8s-key" | base64 -> QVFEdk5QdHB3cTVlRUJBQTIyZWk2dVp4dTRDL01RUW9rR1c2ekE9PQ==
  userKey: QVFEdk5QdHB3cTVlRUJBQTIyZWk2dVp4dTRDL01RUW9rR1c2ekE9PQ==
